<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Heiti SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Arial Unicode MS',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a10"/>
      <stop offset="0.55" stop-color="#3d2412"/>
      <stop offset="1" stop-color="#1a1209"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a2b"/>
      <stop offset="1" stop-color="#e23b2e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- warm hotpot glow bottom-left, echoing the original's ambient light -->
  <ellipse cx="300" cy="700" rx="520" ry="240" fill="url(#ember)" opacity="0.18"/>
  <ellipse cx="1050" cy="120" rx="380" ry="200" fill="#ffb347" opacity="0.07"/>

  <!-- top tag -->
  <text x="80" y="120" font-size="34" fill="#ffd24a" font-weight="700" letter-spacing="2">勇哥说餐饮 · .skill</text>
  <text x="80" y="160" font-size="22" fill="#c9b79a" letter-spacing="1">餐饮创业诊断操作系统 · 先算账，再下判断</text>

  <!-- iconic quote, the headline -->
  <text x="80" y="300" font-size="92" fill="#ffe24a" font-weight="900" filter="url(#soft)">见人拉屎</text>
  <text x="80" y="408" font-size="92" fill="#ffe24a" font-weight="900" filter="url(#soft)">钩子痒。</text>

  <!-- blunt loss-verdict strip, echoing "每天亏2万5" aesthetic -->
  <g transform="translate(80,470)">
    <rect x="0" y="0" width="430" height="64" rx="8" fill="#e23b2e"/>
    <text x="24" y="44" font-size="38" fill="#fff" font-weight="800">做不了 · 关了吧</text>
  </g>

  <!-- diagnostic funnel, right side: the actual framework -->
  <g transform="translate(820,250)" font-size="30" fill="#f3e9d8">
    <text x="0" y="0" font-weight="700" fill="#ffd24a">连麦三件事</text>
    <text x="0" y="56">① 逼五个数</text>
    <text x="36" y="96" font-size="22" fill="#c9b79a">房租·人工·日销·毛利·客流</text>
    <text x="0" y="150">② 现场算保本线</text>
    <text x="0" y="206">③ 下狠判断 + 执行令</text>
  </g>

  <!-- bottom rule + attribution -->
  <line x1="80" y1="612" x2="1200" y2="612" stroke="#5a4631" stroke-width="2"/>
  <text x="80" y="662" font-size="24" fill="#c9b79a">从勇哥真实直播连麦视频中蒸馏 · 多轮一问一答</text>
  <text x="1200" y="662" font-size="22" fill="#8a7a5f" text-anchor="end">github.com/serenakeyitan/yongge-shuocanyin-skill</text>
</svg>
